<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Show Up Tracker</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%234f46e5%22/%3E%3Cpath d=%22M32 8c2 9 12 14 12 28a12 12 0 0 1-24 0c0-6 3-9 5-12 1 4 3 5 4 5-1-8 1-15 3-21z%22 fill=%22%23ffb020%22/%3E%3Cpath d=%22M25 38l5 5 10-12%22 fill=%22none%22 stroke=%22%2314213d%22 stroke-width=%224.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#060a14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--acc:#c8f542;--accbg:#c8f54222;--base:#060807;--o1:#0b4a36;--o2:#1c4a12;--o3:#0f3d2a;--ink:#fff;--mute:rgba(255,255,255,.64);--line:rgba(255,255,255,.16);--miss:#ff7a7a;--missbg:rgba(255,107,107,.22);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--base);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45;font-variant-numeric:tabular-nums;transition:background 1.2s}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 50%,rgba(0,0,0,.5))}
.bg{position:fixed;inset:-12%;z-index:-2;overflow:hidden;pointer-events:none;transform:translate(calc(var(--px,0)*-26px),calc(var(--py,0)*-26px));transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.orb{position:absolute;border-radius:50%;filter:blur(64px);opacity:.8;transition:background 1.2s}
.o1{width:62vmax;height:62vmax;left:-18%;top:-12%;background:var(--o1);animation:f1 19s ease-in-out infinite alternate}
.o2{width:54vmax;height:54vmax;right:-20%;bottom:-8%;background:var(--o2);animation:f2 23s ease-in-out infinite alternate}
.o3{width:42vmax;height:42vmax;left:25%;top:38%;background:var(--o3);opacity:.6;animation:f3 27s ease-in-out infinite alternate}
.o4{width:30vmax;height:30vmax;right:-4%;top:6%;background:var(--acc);opacity:.2;animation:f2 17s ease-in-out infinite alternate-reverse}
@keyframes f1{to{transform:translate(18%,22%) scale(1.15)}}@keyframes f2{to{transform:translate(-22%,-16%) scale(1.2)}}@keyframes f3{to{transform:translate(-30%,14%) scale(.8)}}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px}
.wrap>*{animation:rise .8s cubic-bezier(.16,1,.3,1) both}
.wrap>:nth-child(2){animation-delay:.06s}.wrap>:nth-child(3){animation-delay:.12s}.wrap>:nth-child(4){animation-delay:.18s}.wrap>:nth-child(5){animation-delay:.24s}.wrap>:nth-child(6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97);filter:blur(6px)}}
.lg,.panel,.tabs,.board,.nav,.pill,.chips span,.hero{background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 45%,rgba(255,255,255,.12));-webkit-backdrop-filter:blur(26px) saturate(190%) brightness(1.1);backdrop-filter:blur(26px) saturate(190%) brightness(1.1);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -1px 0 rgba(255,255,255,.1),inset 1px 0 0 rgba(255,255,255,.16),0 26px 50px -26px rgba(0,0,0,.65)}
.panel,.board,.hero,.tabs{position:relative;overflow:hidden;border-radius:30px}
.panel::after,.board::after,.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--mx,25%) var(--my,0%),rgba(255,255,255,.2),transparent 60%)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:42px;height:42px;border-radius:13px;box-shadow:0 10px 24px -10px #000}
h1{font:400 2rem/1 "Instrument Serif",Georgia,serif;margin:0;letter-spacing:-.01em}
.brand small{color:var(--mute);font-size:.8rem;font-weight:600}
.pill{font-size:.76rem;font-weight:700;padding:7px 14px;border-radius:99px}
.tabs{display:flex;gap:4px;padding:5px;margin-bottom:12px;border-radius:26px}
.tab{flex:1;border:0;background:transparent;color:var(--mute);border-radius:21px;padding:9px 4px 8px;font:inherit;font-weight:700;font-size:.88rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:.35s cubic-bezier(.3,1.3,.5,1)}
.tab small{font-weight:600;font-size:.7rem;opacity:.8}
.tab .av{width:38px;height:38px;margin-bottom:3px}
.tab[aria-selected="true"]{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 10px 24px -10px var(--c);transform:translateY(-1px) scale(1.02)}
.av{display:inline-block;border-radius:50%;background:var(--c) center/cover no-repeat;border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 2px var(--c),0 6px 14px -6px #000}
.hero{padding:18px 22px 20px;margin-bottom:10px}
.top2{display:flex;justify-content:space-between;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.mid{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.num{display:flex;align-items:flex-end;gap:8px}
.num b{font:400 6.4rem/.82 "Instrument Serif",Georgia,serif;letter-spacing:-.03em;text-shadow:0 8px 30px rgba(0,0,0,.35)}
.num em{font-style:normal;color:var(--mute);font-weight:700;margin-bottom:10px;font-size:.9rem}
.fl{width:44px;height:44px;margin-bottom:8px;filter:grayscale(1) opacity(.45)}
.fl.on{filter:drop-shadow(0 0 12px rgba(255,120,40,.8));animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.12) rotate(3deg)}}
.ringbox{position:relative;width:96px;height:96px}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:8;stroke-linecap:round}
.ringbox .tr{stroke:rgba(255,255,255,.16)}.ringbox .pr{stroke:url(#g);transition:stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1)}
.ringbox div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringbox b{font:400 1.7rem/1 "Instrument Serif",serif}.ringbox small{color:var(--mute);font-size:.66rem;font-weight:700}
.cta{width:100%;margin-top:16px;padding:15px;border-radius:21px;border:1px solid rgba(255,255,255,.4);background:linear-gradient(165deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 60%),var(--acc);color:#0a1204;font:800 1rem Manrope,sans-serif;letter-spacing:.01em;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),0 16px 32px -14px var(--acc);cursor:pointer;transition:transform .18s cubic-bezier(.3,1.5,.5,1)}
.cta:active{transform:scale(.96)}
.cta.done{color:#fff;background:linear-gradient(165deg,rgba(255,255,255,.3),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chips span{padding:6px 13px;border-radius:99px;font-size:.78rem;font-weight:700}
.panel{padding:18px}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mhead h2{margin:0;font:400 1.8rem/1 "Instrument Serif",Georgia,serif}
.nav{width:42px;height:42px;border-radius:50%;color:#fff;font-size:1.3rem;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.nav:active{transform:scale(.85)}.nav:disabled{opacity:.3;cursor:default}
.bar{display:none}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.dow{text-align:center;color:var(--mute);font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding-bottom:3px}
.day{aspect-ratio:1;border-radius:17px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);color:#fff;font:inherit;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.day:not(:disabled):active{transform:scale(.85)}
.day em{font-style:normal;font-size:.66rem;line-height:1;height:.8rem;opacity:.9}
.day.went{color:#0a1204;background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,0) 55%),var(--acc);border-color:rgba(255,255,255,.4);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),0 10px 18px -10px var(--acc)}
.day.missed{background:var(--missbg);border-color:rgba(255,122,122,.55);color:var(--miss)}
.day.today{box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 18px rgba(255,255,255,.25)}
.day.went.today{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),0 0 0 2px #fff}
.day.future{opacity:.28;cursor:default}
.day.off{background:transparent;border-style:dashed;opacity:.5;cursor:default}
.day:disabled:not(.future){cursor:default}
.day.pop{animation:pop .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.5)}100%{transform:scale(1)}}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px;color:var(--mute);font-size:.76rem;font-weight:600}
.legend span:before{content:"";display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line);background:rgba(255,255,255,.12)}
.legend .l1:before{background:var(--acc);border-color:#fff6}.legend .l2:before{background:var(--missbg);border-color:var(--miss)}
.hint{color:var(--mute);font-size:.8rem;margin:10px 0 0;font-weight:600}
.board{margin-top:12px;padding:16px 18px}
.board h3{margin:0 0 4px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--mute)}
.row{display:flex;align-items:center;gap:11px;margin-top:12px;cursor:pointer}
.row .av{width:38px;height:38px}
.row .t{flex:1;height:10px;border-radius:9px;background:rgba(255,255,255,.14);overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
.row .t i{display:block;height:100%;border-radius:9px;background:linear-gradient(180deg,rgba(255,255,255,.5),transparent),var(--c);transition:width .9s cubic-bezier(.2,.7,.2,1)}
.row b{min-width:46px;text-align:right;font-size:.9rem}
.perfect{color:#0a1204;border-radius:20px;padding:12px 14px;margin-bottom:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.08)),var(--acc);border:1px solid rgba(255,255,255,.4)}
.perfect button,.modal button{font:inherit;font-weight:800;background:#fff;color:#0b1020;border:0;border-radius:13px;padding:9px 16px;cursor:pointer}
.reset{display:block;margin:24px auto 0;background:none;border:0;color:var(--mute);font:inherit;font-size:.8rem;font-weight:600;text-decoration:underline;cursor:pointer}
.overlay{position:fixed;inset:0;background:rgba(3,6,16,.55);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.overlay.on{display:flex}
.modal{background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,.08));-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border-radius:34px;padding:30px 24px;max-width:380px;text-align:center;border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 40px 90px -30px #000;animation:pop .6s cubic-bezier(.3,1.5,.5,1)}
.modal .big{font-size:3.4rem;line-height:1}.modal h3{font:400 2rem/1.1 "Instrument Serif",serif;margin:8px 0}.modal p{color:var(--mute);margin:0 0 18px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px) scale(.9);opacity:0;transition:.35s cubic-bezier(.3,1.5,.5,1);background:#fff;color:#0b1020;padding:11px 20px;border-radius:99px;font-weight:800;font-size:.9rem;z-index:40;pointer-events:none;box-shadow:0 14px 30px -10px #000}
.toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
.tab:focus-visible,.nav:focus-visible,.day:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><i class="orb o4"></i></div>
<canvas id="fx"></canvas>
<div class="overlay" id="pk"><div class="modal" role="dialog" aria-modal="true"><div class="big">👋</div><h3>Who are you?</h3><p>Pick your name and enter your PIN. Only you can log days on your calendar. Everyone else can view it.</p><div id="pkb"></div></div></div>
<div class="wrap">
  <header class="top"><div class="brand"><img src="icon-512.png" alt=""><div><h1>Show Up</h1><small id="dt"></small></div></div><div class="pill">Sundays off</div></header>
  <div class="tabs" id="tabs" role="tablist"></div>
  <p class="hint" id="who" style="margin:0 0 10px"></p><div id="stats" class="stats"></div>
  <div id="perfect"></div>
  <div class="panel">
    <div class="mhead">
      <button class="nav" id="prev" aria-label="Previous month">‹</button>
      <h2 id="mtitle"></h2>
      <button class="nav" id="next" aria-label="Next month">›</button>
    </div>
    <div class="bar"><i id="fill"></i></div>
    <div class="grid" id="grid"></div>
    <div class="legend"><span class="l1">Went</span><span class="l2">Missed</span><span>Not logged</span><span>Sunday: closed</span></div>
    <p class="hint">Finish a month with every open day marked as went to earn a celebration. Sundays are closed and don’t count.</p>
  </div>
  <div class="board glass" id="board"></div>
  <button class="reset" id="reset">Reset all data</button>
</div>
<div class="toast" id="toast"></div>
<div class="overlay" id="ov"><div class="modal" role="dialog" aria-modal="true">
  <div class="big">🏆</div><h3 id="mt"></h3><p id="mp"></p><button id="mc">Keep it going</button>
</div></div>
<script>
const NAMES=['Arish','Moiz','Hamza'];
const AV={Arish:'avatar-arish.jpg',Moiz:'avatar-moiz.jpg',Hamza:'avatar-hamza.jpg'};
const COLORS={Arish:'#c8f542',Moiz:'#c8f542',Hamza:'#c8f542'};
const START={y:2026,m:10};
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SK='showup-v1';
let S;
try{S=JSON.parse(localStorage.getItem(SK))}catch(e){S=null}
if(!S||!S.data)S={data:{Arish:{},Moiz:{},Hamza:{}},seen:{},cur:'Arish'};
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}};
const now=new Date();
const T={y:now.getFullYear(),m:now.getMonth(),d:now.getDate()};
let V={y:Math.max(T.y*12+T.m,START.y*12+START.m)};V={y:Math.floor(V.y/12),m:V.y%12};
const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const idx=(y,m)=>y*12+m;
const todayKey=key(T.y,T.m,T.d);
const $=id=>document.getElementById(id);
let lastTap=null;
function greet(){const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening'}
function cnt(el,to,k){if(!el)return;if(cnt.k===k){el.textContent=to;return}cnt.k=k;const t0=performance.now();(function f(t){const x=Math.min(1,(t-t0)/800);el.textContent=Math.round(to*(1-Math.pow(1-x,3)));if(x<1)requestAnimationFrame(f)})(t0)}
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.panel,.hero,.board');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')}});
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1400)}
$('dt').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});

function streaks(p){
  const D=S.data[p];
  let cur=0,dt=new Date(T.y,T.m,T.d);
  if(dt.getDay()!==0&&D[todayKey]!==1)dt.setDate(dt.getDate()-1);
  for(let i=0;i<4000;i++){
    if(dt.getDay()!==0){if(D[key(dt.getFullYear(),dt.getMonth(),dt.getDate())]===1)cur++;else break}
    dt.setDate(dt.getDate()-1);
  }
  let best=0,run=0;
  const ks=Object.keys(D).filter(k=>D[k]===1).sort();
  if(ks.length){
    let d=new Date(ks[0]+'T00:00:00');const end=new Date(T.y,T.m,T.d);
    for(;d<=end;d.setDate(d.getDate()+1)){
      if(d.getDay()===0)continue;
      if(D[key(d.getFullYear(),d.getMonth(),d.getDate())]===1){run++;best=Math.max(best,run)}else run=0;
    }
  }
  return{cur,best};
}
function monthInfo(p,y,m){
  const dn=dim(y,m);let n=0,went=0,missed=0;
  for(let d=1;d<=dn;d++){if(new Date(y,m,d).getDay()===0)continue;n++;const v=S.data[p][key(y,m,d)];if(v===1)went++;else if(v===0)missed++}
  const ended=idx(y,m)<idx(T.y,T.m);
  return{n,went,missed,ended,perfect:ended&&went===n};
}
function render(){
  $('tabs').innerHTML=NAMES.map(p=>{
    const s=streaks(p);
    return `<button class="tab" role="tab" aria-selected="${p===S.cur}" data-p="${p}" style="--c:${COLORS[p]}"><i class="av" style="background-image:url(${AV[p]})"></i><span>${p}${p===me?' · you':''}</span><small>${shared&&!claimed[p]?'not joined':s.cur+(s.cur===1?' day':' days')}</small></button>`}).join('');
  const p=S.cur;document.documentElement.style.setProperty('--acc',COLORS[p]);
  const accbg=COLORS[p]+'22';document.documentElement.style.setProperty('--accbg',accbg);
  const s=streaks(p),mi=monthInfo(p,V.y,V.m);
  $('who').textContent=!shared?'Tap a day to log it: went, missed, or cleared.':!me?'':p===me?'Your calendar. Tap a day to log it: went, missed, or cleared.':'Viewing '+p+'’s calendar. View only.';
  $('reset').textContent=shared?'Not you? Switch person':'Reset all data';
  $('reset').style.display=shared&&!me?'none':'';
  $('dt').textContent=me?greet()+', '+me:new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  renderPick();
  const C=2*Math.PI*40,pct=mi.n?mi.went/mi.n:0;
  const tv=S.data[p][todayKey],canLog=(!shared||p===me)&&new Date().getDay()!==0;
  const ms=s.cur>=30?'Month master':s.cur>=14?'Two weeks strong':s.cur>=7?'One week streak':'';
  $('stats').innerHTML=`<div class="hero"><div class="top2"><span>Current streak</span><span>Best ${s.best}</span></div><div class="mid"><div class="num"><svg class="fl ${s.cur?'on':''}" viewBox="0 0 64 64"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd166"/><stop offset="1" stop-color="#ff4d2e"/></linearGradient></defs><path fill="url(#fg)" d="M32 6c2 9 13 15 13 30a13 13 0 0 1-26 0c0-6 3-10 5-13 1 4 3 5 4 5-1-8 1-15 4-22z"/></svg><b>${s.cur}</b><em>${s.cur===1?'day':'days'}</em></div><div class="ringbox"><svg viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--acc)"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><circle class="tr" cx="50" cy="50" r="40"/><circle class="pr" cx="50" cy="50" r="40" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}"/></svg><div><b>${mi.went}/${mi.n}</b><small>this month</small></div></div></div>${canLog?`<button class="cta ${tv===1?'done':''}" id="cta">${tv===1?'Checked in today':tv===0?'Marked missed · tap to clear':'Check in today'}</button>`:''}</div><div class="chips"><span>${mi.missed} missed</span>${ms?'<span>'+ms+'</span>':''}<span>Sundays off</span></div>`;
  cnt($('stats').querySelector('.num b'),s.cur,p+':'+s.cur);
  $('mtitle').textContent=MN[V.m]+' '+V.y;
  $('prev').disabled=idx(V.y,V.m)<=idx(START.y,START.m);
  $('next').disabled=idx(V.y,V.m)>=idx(T.y,T.m);
  $('fill').style.width=(mi.went/mi.n*100)+'%';
  $('perfect').innerHTML=mi.perfect?`<div class="perfect"><span>🏆 Perfect ${MN[V.m]}! ${p} made it to every single day.</span><button id="cel">Celebrate</button></div>`:'';
  const first=new Date(V.y,V.m,1).getDay();let h=DW.map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let d=1;d<=dim(V.y,V.m);d++){
    const k=key(V.y,V.m,d),v=S.data[p][k];
    const off=new Date(V.y,V.m,d).getDay()===0,fut=k>todayKey,ro=shared&&S.cur!==me;
    const cls=['day',off?'off':v===1?'went':v===0?'missed':'',k===todayKey?'today':'',k===lastTap?'pop':'',fut?'future':''].join(' ');
    const lab=off?'Off':v===1?'✓':v===0?'✕':'';
    h+=`<button class="${cls}" data-k="${k}" ${fut||ro||off?'disabled':''} aria-label="${MN[V.m]} ${d}: ${v===1?'went':v===0?'missed':'not logged'}">${d}<em>${lab}</em></button>`;
  }
  $('grid').innerHTML=h;lastTap=null;
  $('board').innerHTML='<h3>'+MN[V.m]+' · everyone</h3>'+NAMES.map(n=>{const m=monthInfo(n,V.y,V.m);return `<div class="row" data-p="${n}" style="--c:${COLORS[n]}"><i class="av" style="background-image:url(${AV[n]})"></i><div class="t"><i style="width:${m.n?m.went/m.n*100:0}%"></i></div><b>${m.went}/${m.n}</b></div>`}).join('');
}

function theme(){const P=['#060807','#0b4a36','#1c4a12','#0f3d2a'],r=document.documentElement.style;['--base','--o1','--o2','--o3'].forEach((k,i)=>r.setProperty(k,P[i]))}

  if(v===undefined)D[k]=1;else if(v===1)D[k]=0;else delete D[k];
  S.data[S.cur]=D;lastTap=k;toast(D[k]===1?'Logged ✓ Nice work':D[k]===0?'Marked as missed':'Cleared');try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
  if(shared)push(D);

};
$('prev').onclick=()=>{V.m--;if(V.m<0){V.m=11;V.y--}render()};
$('next').onclick=()=>{V.m++;if(V.m>11){V.m=0;V.y++}render()};
$('perfect').onclick=e=>{if(e.target.id==='cel')confetti()};
$('mc').onclick=()=>{$('ov').classList.remove('on');check()};

let queue=[];
function check(){
  if($('ov').classList.contains('on'))return;
  for(const p of NAMES){
    let y=START.y,m=START.m;
    while(idx(y,m)<idx(T.y,T.m)){
      const id=p+'-'+y+'-'+m;
      if(!S.seen[id]&&monthInfo(p,y,m).perfect){
        S.seen[id]=1;save();
        $('mt').textContent='Perfect '+MN[m]+', '+p+'!';
        $('mp').textContent=`${p} showed up for all ${monthInfo(p,y,m).n} gym days of ${MN[m]}. That kind of consistency is rare, and it’s worth being proud of. Thank you for the effort!`;
        $('ov').classList.add('on');confetti();return;
      }
      m++;if(m>11){m=0;y++}
    }
  }
}
function confetti(){
  const c=$('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#c8f542','#ffffff','#4ade80','#fde047','#d9f99d'];
  const P=Array.from({length:160},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,r:4+Math.random()*5,vx:-1.5+Math.random()*3,vy:2+Math.random()*4,c:cols[Math.random()*5|0],a:Math.random()*6}));
  let f=0;
  (function loop(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(q=>{q.x+=q.vx;q.y+=q.vy;q.a+=.1;x.save();x.translate(q.x,q.y);x.rotate(q.a);x.fillStyle=q.c;x.fillRect(-q.r,-q.r/2,q.r*2,q.r);x.restore()});
    if(++f<220)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height);
  })();
}

async function push(D){
